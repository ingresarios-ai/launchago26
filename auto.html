<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrándote... — El Juego Mental del Dinero</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .status {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .error {
      color: #ef4444;
      margin-top: 16px;
      font-size: 0.9rem;
    }

    .error a {
      color: #10B981;
      text-decoration: underline;
    }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Preparando tu acceso...</h1>
    <p class="status" id="status">Registrándote automáticamente en el taller</p>
    <p class="error" id="error" style="display:none;"></p>
  </div>

  <script>
    // ========================================
    // AUTO-REGISTRATION PAGE
    // 1-click registration from GHL email
    // ========================================

    var SUPABASE_URL = 'https://chnpzcpczjtdsbfmjhei.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobnB6Y3Bjemp0ZHNiZm1qaGVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwOTc5ODYsImV4cCI6MjA5OTY3Mzk4Nn0.-0v-yxG8M4aAmt-TEezV-4il22ZqW9wSA0XwspmwQRU';
    var GHL_WEBHOOK = 'https://services.leadconnectorhq.com/hooks/jTugwykceKyJlATOSvkb/webhook-trigger/deaadf50-9f15-4372-a5b4-5ec030b01fea';

    // Load dynamic webhook from system_settings
    fetch(SUPABASE_URL + '/rest/v1/system_settings?key=eq.ghl_registration_webhook', {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.length > 0 && data[0].value) {
        GHL_WEBHOOK = data[0].value;
      }
    })
    .catch(function () {});

    // ========================================
    // MAIN AUTO-REGISTRATION FLOW
    // ========================================

    (function () {
      var params = new URLSearchParams(window.location.search);
      var name = (params.get('name') || '').trim();
      var email = (params.get('email') || '').trim();
      var phone = (params.get('phone') || '').trim();
      var utm_source = params.get('utm_source') || 'ghl';
      var utm_medium = params.get('utm_medium') || 'email';
      var utm_campaign = params.get('utm_campaign') || 'auto_registro';
      var utm_content = params.get('utm_content') || '';
      var utm_term = params.get('utm_term') || '';

      // Validate minimum data
      if (!email) {
        showError('No se encontraron tus datos en el enlace. <a href="https://taller.ingresarios.net">Regístrate manualmente aquí</a>.');
        return;
      }

      if (!name) name = email.split('@')[0]; // fallback

      updateStatus('Creando tu cuenta en el taller...');

      var leadData = {
        name: name,
        email: email,
        phone: phone || null,
        landing: 'Auto-Registro Email GHL',
        utm_source: utm_source || null,
        utm_medium: utm_medium || null,
        utm_campaign: utm_campaign || null,
        utm_content: utm_content || null,
        utm_term: utm_term || null
      };

      var ghlData = Object.assign({}, leadData, {
        source: 'auto_registro_ghl'
      });

      // Step 1: Insert lead into Supabase
      fetch(SUPABASE_URL + '/rest/v1/leads', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(leadData)
      })
      .then(function (res) {
        if (!res.ok) {
          return res.json().then(function (err) {
            // Duplicate email — already registered, just get their token
            if (err.code === '23505') {
              updateStatus('Ya tienes cuenta — recuperando tu acceso...');
              return fetch(SUPABASE_URL + '/rest/v1/rpc/get_token_by_email', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ p_email: email })
              }).then(function (r) { return r.json(); });
            }
            throw new Error(err.message || 'Error al registrar');
          });
        }
        // New lead — get their token
        updateStatus('Generando tu acceso a la plataforma...');
        return fetch(SUPABASE_URL + '/rest/v1/rpc/get_token_by_email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ p_email: email })
        }).then(function (r) { return r.json(); });
      })
      .then(function (data) {
        var token = '';
        if (Array.isArray(data) && data.length > 0) {
          token = data[0].get_token_by_email || data[0].auth_token || '';
        } else if (data) {
          token = data.get_token_by_email || data.auth_token || (typeof data === 'string' ? data : '');
        }

        // Update magic links if we have a token
        if (token) {
          var magicLink = 'https://taller.ingresarios.net/app?token=' + token;
          var magicLinkEncuesta = 'https://taller.ingresarios.net/encuesta?t=' + token;

          fetch(SUPABASE_URL + '/rest/v1/rpc/update_magic_link', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ p_token: token, p_magic_link: magicLink })
          }).catch(function () {});

          fetch(SUPABASE_URL + '/rest/v1/leads?auth_token=eq.' + token, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ magic_link_encuesta: magicLinkEncuesta })
          }).catch(function () {});

          // Store in localStorage for gracias.html and app
          localStorage.setItem('auth_token', token);
          localStorage.setItem('user_email', email);
          sessionStorage.removeItem('lead_pixel_fired');

          // Enrich GHL data with magic links
          ghlData.auth_token = token;
          ghlData.magic_link = magicLink;
          ghlData['contact.el__magic_link_encuesta'] = magicLinkEncuesta;
        }

        // ALWAYS fire GHL webhook
        updateStatus('Confirmando tu registro...');
        fetch(GHL_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ghlData),
          keepalive: true
        }).catch(function () {});

        // Success — redirect to gracias.html
        updateStatus('¡Listo! Redirigiendo...');
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = '✅ ¡Registro completo!';

        setTimeout(function () {
          window.location.href = 'gracias.html';
        }, 500);
      })
      .catch(function (err) {
        console.error('Auto-registration error:', err);
        showError('Hubo un problema con el registro automático. <a href="https://taller.ingresarios.net">Regístrate manualmente aquí</a>.');
      });
    })();

    // ========================================
    // UI HELPERS
    // ========================================

    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function showError(html) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = '⚠️ Algo salió mal';
      document.getElementById('status').style.display = 'none';
      var errorEl = document.getElementById('error');
      errorEl.innerHTML = html;
      errorEl.style.display = 'block';
    }
  </script>
</body>
</html>
