  <style>
    /* Custom Global & Print Styles */
    body {
      font-family: 'Inter', sans-serif;

    /* Print Stylesheet */

<body class="min-h-screen bg-ing-dark text-slate-100 relative overflow-x-hidden selection:bg-emerald-500 selection:text-black">

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- SVG Icon Components for Zero Dependencies & High Performance ---
    const IconShield = ({ className = "w-5 h-5" }) => (

    const IconLock = ({ className = "w-5 h-5" }) => (

    );

    const IconUser = ({ className = "w-5 h-5" }) => (

    );

    const IconCalendar = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );

    const IconBriefcase = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    );

    const IconRocket = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
    );

    const IconSun = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    );

    const IconPrinter = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    );

    const IconEdit3 = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    );

    const IconCheck = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    );

    const IconRotateCcw = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    );

    const IconSparkles = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );

    const IconAward = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
    );

    // --- Helper Functions ---
    const formatNumberWithCommas = (val) => {
      if (val === null || val === undefined || val === '') return '';
      const num = parseFloat(val);
      if (isNaN(num)) return '';
      return num.toLocaleString('en-US');
    };

    const cleanNumericInput = (val) => {
      if (!val) return '';
      // allow only digits
      return val.replace(/[^0-9]/g, '');
    };

    const formatCurrency = (val, currency = 'USD') => {
      const num = parseFloat(val) || 0;
      return `$${num.toLocaleString('en-US')} ${currency}`;
    };

    // --- Main App Component ---
    function MapaCapitalApp() {
      // Form State
      const [nombre, setNombre] = useState('');
      const [fecha, setFecha] = useState(() => new Date().toISOString().split('T')[0]);
      const [perfil, setPerfil] = useState('Trader');
      const [currency, setCurrency] = useState('USD');

      // Paso 1: Brecha
      const [necesidadHogar, setNecesidadHogar] = useState('');
      const [ingresoNoDep, setIngresoNoDep] = useState('');

      // Paso 2: Las 4 Zonas de Capital
      const [zonaSeguridad, setZonaSeguridad] = useState('');
      const [zonaObjetivos, setZonaObjetivos] = useState('');
      const [zonaAprendizaje, setZonaAprendizaje] = useState('');
      const [zonaOperacion, setZonaOperacion] = useState('');

      // Paso 3: Validación (Licencia de Protección)
      const [checkNoDeuda, setCheckNoDeuda] = useState(false);
      const [checkNoFamilia, setCheckNoFamilia] = useState(false);
      const [checkSimulacion, setCheckSimulacion] = useState(false);

      // Paso 4: Fuga y Regla
      const [fugaPersonal, setFugaPersonal] = useState('');
      const [reglaPersonal, setReglaPersonal] = useState('');

      // View State: 'form' | 'summary'
      const [viewMode, setViewMode] = useState('form');

      // Load draft from localStorage on mount
      useEffect(() => {
        try {
          const saved = localStorage.getItem('ingresarios_mapa_capital_draft');
          if (saved) {
            const data = JSON.parse(saved);
            if (data.nombre) setNombre(data.nombre);
            if (data.fecha) setFecha(data.fecha);
            if (data.perfil) setPerfil(data.perfil);
            if (data.currency) setCurrency(data.currency);
            if (data.necesidadHogar) setNecesidadHogar(data.necesidadHogar);
            if (data.ingresoNoDep) setIngresoNoDep(data.ingresoNoDep);
            if (data.zonaSeguridad) setZonaSeguridad(data.zonaSeguridad);
            if (data.zonaObjetivos) setZonaObjetivos(data.zonaObjetivos);
            if (data.zonaAprendizaje) setZonaAprendizaje(data.zonaAprendizaje);
            if (data.zonaOperacion) setZonaOperacion(data.zonaOperacion);
            if (data.checkNoDeuda) setCheckNoDeuda(data.checkNoDeuda);
            if (data.checkNoFamilia) setCheckNoFamilia(data.checkNoFamilia);
            if (data.checkSimulacion) setCheckSimulacion(data.checkSimulacion);
            if (data.fugaPersonal) setFugaPersonal(data.fugaPersonal);
            if (data.reglaPersonal) setReglaPersonal(data.reglaPersonal);
          }
        } catch (e) {
          // ignore storage read issues
        }
      }, []);

      // Auto-save draft
      useEffect(() => {
        try {
          const draft = {
            nombre, fecha, perfil, currency,
            necesidadHogar, ingresoNoDep,
            zonaSeguridad, zonaObjetivos, zonaAprendizaje, zonaOperacion,
            checkNoDeuda, checkNoFamilia, checkSimulacion,
            fugaPersonal, reglaPersonal
          };
          localStorage.setItem('ingresarios_mapa_capital_draft', JSON.stringify(draft));
        } catch (e) {
          // ignore
        }
      }, [
        nombre, fecha, perfil, currency,
        necesidadHogar, ingresoNoDep,
        zonaSeguridad, zonaObjetivos, zonaAprendizaje, zonaOperacion,
        checkNoDeuda, checkNoFamilia, checkSimulacion,
        fugaPersonal, reglaPersonal
      ]);

      // --- Numerical Calculations ---
      const numNecesidad = parseFloat(necesidadHogar) || 0;
      const numIngresoNoDep = parseFloat(ingresoNoDep) || 0;

      // Brecha = A - B (Si B > A, Brecha = 0)
      const brechaMensual = useMemo(() => {
        return Math.max(0, numNecesidad - numIngresoNoDep);
      }, [numNecesidad, numIngresoNoDep]);

      // Cobertura porcentual
      const ratioCobertura = useMemo(() => {
        if (numNecesidad <= 0) return numIngresoNoDep > 0 ? 100 : 0;
        return (numIngresoNoDep / numNecesidad) * 100;
      }, [numNecesidad, numIngresoNoDep]);

      // Dynamic Diagnostic Badge:
      // - CUBIERTA: Si Brecha <= 0 (Color Verde)
      // - BAJA: Si B cubre más del 60% de A (Color Amarillo/Verde claro)
      // - MEDIA: Si B cubre entre el 20% y 60% de A (Color Naranja)
      // - ALTA: Si B cubre menos del 20% de A (Color Rojo)
      const diagnostico = useMemo(() => {
        if (numNecesidad <= 0 && numIngresoNoDep <= 0) {
          return {
            tipo: 'PENDIENTE',
            label: 'PENDIENTE DE DATOS',
            colorBadge: 'bg-slate-800 text-slate-400 border-slate-700',
            colorCard: 'border-slate-800 bg-slate-900/40',
            titulo: 'Ingresa tus números para diagnosticar',
            mensaje: 'Completa los montos de necesidad mensual y fuentes de ingreso no dependiente para calcular tu brecha de tranquilidad.'
          };
        }

        if (brechaMensual <= 0 && numNecesidad > 0) {
          return {
            tipo: 'CUBIERTA',
            label: 'CUBIERTA (100%+)',
            colorBadge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50',
            colorCard: 'border-emerald-500/30 bg-emerald-950/20',
            titulo: 'Tranquilidad Total — Emancipación Operativa',
            mensaje: 'Tus ingresos no dependientes cubren por completo los gastos fundamentales de tu hogar. Cuentas con la máxima solidez psicológica para tomar decisiones en el mercado sin prisa ni necesidad.'
          };
        }

        if (ratioCobertura >= 60) {
          return {
            tipo: 'BAJA',
            label: 'BRECHA BAJA',
            colorBadge: 'bg-lime-500/20 text-lime-300 border-lime-500/50',
            colorCard: 'border-lime-500/30 bg-lime-950/20',
            titulo: 'Margen Favorable — Cobertura Superior al 60%',
            mensaje: 'Cuentas con un colchón de protección muy respetable. Más del 60% de tu costo de vida digno está asegurado sin depender de tus horas diarias de trabajo activo.'
          };
        }

        if (ratioCobertura >= 20 && ratioCobertura < 60) {
          return {
            tipo: 'MEDIA',
            label: 'BRECHA MEDIA',
            colorBadge: 'bg-amber-500/20 text-amber-300 border-amber-500/50',
            colorCard: 'border-amber-500/30 bg-amber-950/20',
            titulo: 'Transición Activa — Cobertura entre 20% y 60%',
            mensaje: 'Cubres una porción de tus costos vitales, pero una interrupción en tus ingresos laborales comprometería la estabilidad del hogar. Requiere máxima disciplina para no arriesgar este patrimonio.'
          };
        }

        return {
          tipo: 'ALTA',
          label: 'BRECHA ALTA',
          colorBadge: 'bg-rose-500/20 text-rose-300 border-rose-500/50',
          colorCard: 'border-rose-500/30 bg-rose-950/20',
          titulo: 'Alerta de Vulnerabilidad — Menos del 20% Cubierto',
          mensaje: 'Dependencia crítica del 80%+ de tu tiempo y trabajo presente. La urgencia económica en el trading es letal: el mercado huele la necesidad de pagar cuentas y castiga la desesperación.'
        };
      }, [brechaMensual, ratioCobertura, numNecesidad, numIngresoNoDep]);

      // Paso 2: Zonas de Capital
      const numZona1 = parseFloat(zonaSeguridad) || 0;
      const numZona2 = parseFloat(zonaObjetivos) || 0;
      const numZona3 = parseFloat(zonaAprendizaje) || 0;
      const numZona4 = parseFloat(zonaOperacion) || 0;

      const capitalTotal = useMemo(() => {
        return numZona1 + numZona2 + numZona3 + numZona4;
      }, [numZona1, numZona2, numZona3, numZona4]);

      // Porcentajes de Zonas
      const pctZona1 = capitalTotal > 0 ? (numZona1 / capitalTotal) * 100 : 0;
      const pctZona2 = capitalTotal > 0 ? (numZona2 / capitalTotal) * 100 : 0;
      const pctZona3 = capitalTotal > 0 ? (numZona3 / capitalTotal) * 100 : 0;
      const pctZona4 = capitalTotal > 0 ? (numZona4 / capitalTotal) * 100 : 0;

      // Validación visual: Zona 4 > 0 pero Zona 1 en 0 o vacía
      const showWarningZonaSeguridad = useMemo(() => {
        return numZona4 > 0 && numZona1 <= 0;
      }, [numZona4, numZona1]);

      // Paso 3: Licencia de Protección
      const allCheckboxesChecked = checkNoDeuda && checkNoFamilia && checkSimulacion;

      // Reset Function
      const handleResetForm = () => {
        if (window.confirm('¿Deseas reiniciar la calculadora y limpiar los datos ingresados?')) {
          setNombre('');
          setFecha(new Date().toISOString().split('T')[0]);
          setPerfil('Trader');
          setNecesidadHogar('');
          setIngresoNoDep('');
          setZonaSeguridad('');
          setZonaObjetivos('');
          setZonaAprendizaje('');
          setZonaOperacion('');
          setCheckNoDeuda(false);
          setCheckNoFamilia(false);
          setCheckSimulacion(false);
          setFugaPersonal('');
          setReglaPersonal('');
          setViewMode('form');
          localStorage.removeItem('ingresarios_mapa_capital_draft');
        }
      };

      // Handle Submit to Summary
      const handleGenerateMap = (e) => {
        e.preventDefault();
        if (!allCheckboxesChecked) {
          alert('Debes validar y marcar las 3 casillas de la Licencia de Protección antes de continuar.');
          return;
        }
        if (!nombre.trim()) {
          alert('Por favor ingresa tu nombre para personalizar tu Mapa de Capital.');
          return;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setViewMode('summary');
      };

      return (
        <div className="min-h-screen relative flex flex-col justify-between">
          {/* Ambient Lighting & Gradients */}
          <div className="glow-orb-green top-0 right-10"></div>
          <div className="glow-orb-blue bottom-40 left-10"></div>
          <div className="fixed inset-0 bg-grid-pattern pointer-events-none opacity-40"></div>

          {/* Top Bar Header */}
          <header className="relative z-20 border-b border-ing-border bg-ing-dark/85 backdrop-blur-md sticky top-0 no-print">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <img 
                  src="ingresarios-logo.webp" 
                  alt="Ingresarios Logo" 
                  className="h-7 w-auto object-contain"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div className="border-l border-slate-700 pl-3 hidden sm:block">
                  <span className="text-[11px] font-semibold tracking-widest text-emerald-400 uppercase font-heading">
                    El Otro 10%
                  </span>
                  <span className="block text-xs text-slate-400 font-medium">
                    Mapa de Capital
                  </span>
                </div>
              </div>

                      <div className="flex items-start gap-2 text-slate-200 print-text-dark">
                        <IconCheckCircle className="w-4 h-4 text-emerald-400 flex-shrink-0 mt-0.5" />
                        <span>Cero impacto a la estabilidad básica y bienestar del hogar.</span>
                      </div>
                      <div className="flex items-start gap-2 text-slate-200 print-text-dark">
                        <IconCheckCircle className="w-4 h-4 text-emerald-400 flex-shrink-0 mt-0.5" />
                        <span>Validación previa estricta en simulación y tamaño micro.</span>
                      </div>
                    </div>
                  </div>

                  {/* 5. Declaraciones Personales de Protección */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div className="p-5 rounded-2xl bg-slate-900/70 border border-rose-500/30 print-bg-subtle">
                      <span className="text-[11px] font-bold text-rose-400 uppercase tracking-widest font-heading block mb-2">
                        Fuga Personal Identificada
                      </span>
                      <p className="text-sm text-slate-200 italic leading-relaxed print-text-dark">
                        "{fugaPersonal.trim() || 'No declarada explícitamente.'}"
                      </p>
                    </div>

                    <div className="p-5 rounded-2xl bg-slate-900/70 border border-emerald-500/30 print-bg-subtle">
                      <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-widest font-heading block mb-2">
                        Regla de Oro (Conducta Observable)
                      </span>
                      <p className="text-sm text-slate-200 italic leading-relaxed print-text-dark">
                        "{reglaPersonal.trim() || 'No declarada explícitamente.'}"
                      </p>
                    </div>
                  </div>

                  {/* Signature & Seal Area */}
                  <div className="pt-6 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-6 text-xs text-slate-400">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-heading font-black">
                        10%
                      </div>
                      <div>
                        <span className="text-white font-bold block font-heading print-text-dark">Método Ingresarios</span>
                        <span>Filosofía de Inversión y Gestión Patrimonial</span>
                      </div>
                    </div>

                    <div className="text-center sm:text-right">
                      <div className="w-48 border-b border-slate-600 mb-1 mx-auto sm:ml-auto"></div>
                      <span className="font-heading font-semibold text-slate-300 print-text-dark">
                        Firma / Compromiso de {nombre || 'Inversor'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Bottom Action Buttons in Summary View */}
                <div className="flex flex-wrap items-center justify-center gap-4 pt-4 no-print">
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="px-8 py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-heading font-black text-sm uppercase tracking-wider shadow-glow-green hover:scale-105 transition"
                  >
                    Imprimir / Guardar en PDF
                  </button>

                  <button
                    type="button"
                    onClick={() => { setViewMode('form'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="px-6 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-heading font-bold text-sm uppercase transition"
                  >
                    Modificar Datos
                  </button>

                  <button
                    type="button"
                    onClick={handleResetForm}
                    className="px-6 py-3.5 rounded-xl bg-transparent hover:bg-slate-900 text-slate-400 hover:text-slate-300 text-sm font-medium transition"
                  >
                    Nuevo Diagnóstico
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="relative z-10 border-t border-slate-800/80 bg-ing-dark py-6 text-center text-xs text-slate-500 no-print">
            <div className="max-w-5xl mx-auto px-4 space-y-2">
              <p>© {new Date().getFullYear()} Ingresarios — Todos los derechos reservados.</p>
              <p className="text-[11px] text-slate-600 max-w-xl mx-auto">
                Herramienta estrictamente educativa y de diagnóstico patrimonial para sesiones privadas. No constituye asesoramiento financiero regulado ni solicitud de captación de recursos.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MapaCapitalApp />);
  </script>
</body>
</html>
