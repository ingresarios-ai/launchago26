  <style>
    :root {
      --bg-dark: #0a0e13;
      --bg-card: #111820;
      --border-subtle: #1e2a38;
      --green-primary: #22c55e;
      --green-glow: #4ade80;
      --green-accent: #15803d;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --text-gray-light: #cbd5e1;
      --text-muted: #64748b;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --transition-fast: 0.2s ease;
      --transition-medium: 0.35s ease;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* Background Orbs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
    }
    .bg-orb--1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 70%);
      top: -15%; right: -8%;
      animation: float1 8s ease-in-out infinite;
    }
    .bg-orb--2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, transparent 70%);
      bottom: -20%; left: -10%;
      animation: float2 10s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, 20px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -25px); }
    }

    /* Main Container */
    .hub {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Logo */
    .hub__logo {
      max-width: 220px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    /* Badge */
    .hub__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--green-primary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s forwards;
    }
    .hub__badge-dot {
      width: 8px; height: 8px;
      background: var(--green-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-primary);
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    /* Title */
    .hub__title {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.6s 0.3s forwards;
    }
    .hub__title span {
      color: var(--green-primary);
      text-shadow: 0 0 25px rgba(34,197,94,0.35);
    }

    /* Subtitle */
    .hub__subtitle {
      font-size: 1.05rem;
      color: var(--text-gray-light);
      margin-bottom: 40px;
      max-width: 440px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.6s 0.4s forwards;
    }

    /* Buttons */
    .hub__actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.6s 0.5s forwards;
    }

    .hub__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-medium);
      text-transform: uppercase;
      text-decoration: none;
    }

    .hub__btn--primary {
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-accent) 100%);
      color: var(--text-white);
      box-shadow: 0 4px 24px rgba(34,197,94,0.35);
    }
    .hub__btn--primary:hover {
      background: linear-gradient(135deg, var(--green-glow) 0%, var(--green-primary) 100%);
      box-shadow: 0 8px 36px rgba(34,197,94,0.5);
      transform: translateY(-3px);
    }

    .hub__btn--secondary {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
    }
    .hub__btn--secondary:hover {
      border-color: rgba(34,197,94,0.4);
      background: rgba(34,197,94,0.06);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .hub__btn--outline {
      background: transparent;
      color: var(--green-primary);
      border: 1px solid rgba(34,197,94,0.35);
    }
    .hub__btn--outline:hover {
      background: rgba(34,197,94,0.08);
      border-color: var(--green-primary);
      transform: translateY(-2px);
    }

    .hub__btn-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* Divider */
    .hub__divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,197,94,0.3), transparent);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 0.6s 0.6s forwards;
    }

    /* Footer */
    .hub__footer {
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeUp 0.6s 0.7s forwards;
    }
    .hub__footer a {
      color: var(--green-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .hub__footer a:hover {
      color: var(--green-glow);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .hub__title { font-size: 1.9rem; }
      .hub__subtitle { font-size: 0.95rem; }
      .hub__btn { padding: 16px 20px; font-size: 0.88rem; }
    }
