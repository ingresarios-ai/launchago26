  <!-- SEO & Social Share -->

</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PG9F8H6M" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar__brand">
      <img src="logo-genoma.webp" alt="Genoma Logo" style="height: 28px; width: auto;" />
    </div>
    <div class="topbar__profile">
      <div class="topbar__saboteur">
        <span id="saboteur-emoji" class="topbar__emoji">👤</span>
        <span id="saboteur-name" class="topbar__name">Cargando...</span>
      </div>
      <a href="https://chat.whatsapp.com/DmyOUUMaHAdLxC0xo2Lr9b" target="_blank" class="topbar__wa-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Mi Tribu
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT: THE JOURNEY PATH -->
  <main class="app-container journey-container">
    
    <!-- PROGRESS HEADER -->
    <div class="journey-header">
      <h1 class="journey-title">GENOMA CERO</h1>
      <p class="journey-subtitle">Prepárate para el evento. 10 días, 10 misiones.</p>
      
      <div class="journey-progress-bar">
        <div class="progress-fill" id="journey-progress-fill" style="width: 10%;"></div>
      </div>
      <p class="progress-text">Día <span id="current-day-text">1</span> de 10</p>
    </div>

    <!-- CHAPTER 1 -->
    <div class="journey-chapter">
      <h2 class="chapter-title">Capítulo 1: Despierta</h2>
      <div class="chapter-nodes">
        
        <!-- Act 1 -->
        <button class="node active" data-act="1" onclick="openActivity(1)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
            <div class="node-connector-line"></div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 1: Bienvenido a GENOMA</h3>
            <p class="node-desc">Explicar el viaje.</p>
            <span class="node-points">+20 pts</span>
          </div>
        </button>

        <!-- Act 2 -->
        <button class="node locked" data-act="2" onclick="openActivity(2)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 2: Punto de partida</h3>
            <p class="node-desc">Completar el diagnóstico.</p>
            <span class="node-points">+30 pts</span>
          </div>
        </button>

      </div>
    </div>

    <!-- CHAPTER 2 -->
    <div class="journey-chapter">
      <h2 class="chapter-title">Capítulo 2: Descúbrete</h2>
      <div class="chapter-nodes">
        
        <!-- Act 3 -->
        <button class="node locked" data-act="3" onclick="openActivity(3)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="node-connector-line"></div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 3: Tu patrón dominante</h3>
            <p class="node-desc">Mostrar el resultado del diagnóstico.</p>
            <span class="node-points">+15 pts</span>
          </div>
        </button>

        <!-- Act 5 (Was act 5, let's keep user numbering) -->
        <button class="node locked" data-act="5" onclick="openActivity(5)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 5: Observa tus decisiones</h3>
            <p class="node-desc">Registrar una situación del día.</p>
            <span class="node-points">+15 pts</span>
          </div>
        </button>

      </div>
    </div>

    <!-- CHAPTER 3 -->
    <div class="journey-chapter">
      <h2 class="chapter-title">Capítulo 3: Prepárate</h2>
      <div class="chapter-nodes">
        
        <!-- Act 4 -->
        <button class="node locked" data-act="4" onclick="openActivity(4)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <div class="node-connector-line"></div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 4: Diseña tu entorno</h3>
            <p class="node-desc">Preparar todo antes del evento.</p>
            <span class="node-points">+20 pts</span>
          </div>
        </button>

        <!-- Act 6 -->
        <button class="node locked" data-act="6" onclick="openActivity(6)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 6: Cumple una promesa pequeña</h3>
            <p class="node-desc">Ejecutar una acción de menos de cinco minutos.</p>
            <span class="node-points">+15 pts</span>
          </div>
        </button>

      </div>
    </div>

    <!-- CHAPTER 4 -->
    <div class="journey-chapter">
      <h2 class="chapter-title">Capítulo 4: Conéctate</h2>
      <div class="chapter-nodes">
        
        <!-- Act 7 -->
        <button class="node locked" data-act="7" onclick="openActivity(7)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="node-connector-line"></div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 7: Comparte tu avance</h3>
            <p class="node-desc">Publicar una reflexión en la comunidad.</p>
            <span class="node-points">+20 pts</span>
          </div>
        </button>

        <!-- Act 8 -->
        <button class="node locked" data-act="8" onclick="openActivity(8)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 8: Conoce a GENY</h3>
            <p class="node-desc">Conversar con el asistente.</p>
            <span class="node-points">+15 pts</span>
          </div>
        </button>

      </div>
    </div>

    <!-- CHAPTER 5 -->
    <div class="journey-chapter">
      <h2 class="chapter-title">Capítulo 5: Despega</h2>
      <div class="chapter-nodes">
        
        <!-- Act 9 -->
        <button class="node locked" data-act="9" onclick="openActivity(9)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div class="node-connector-line"></div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 9: Confirma asistencia</h3>
            <p class="node-desc">Preparar el evento.</p>
            <span class="node-points">+20 pts</span>
          </div>
        </button>

        <!-- Act 10 -->
        <button class="node locked" data-act="10" onclick="openActivity(10)">
          <div class="node-left">
            <div class="node-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
          </div>
          <div class="node-content">
            <h3 class="node-title">Actividad 10: Todo listo</h3>
            <p class="node-desc">Pantalla de celebración y entrada.</p>
            <span class="node-points">+50 pts</span>
          </div>
        </button>

      </div>
    </div>

  </main>

  <!-- ACTIVITY MODAL (FULLSCREEN) -->
  <div class="activity-modal" id="activity-modal">
    <!-- Header -->
    <div class="activity-header">
      <button class="btn-close-activity" onclick="closeActivity()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="activity-points" id="activity-points-indicator" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3 6 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
        <span id="activity-reward-text">+20 pts</span>
      </div>
    </div>

    <!-- Dynamic Content Area -->
    <div class="activity-content" id="activity-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
